stage: 1
name: human_to_human_pretrain
seed: 42

model:
  file: network/model.py
  class_name: AINet
  freeze_cross_attn: false
  use_ifb: false
  motion_mlp:
    hidden_dim: 512
    embed_dim: 512
    dropout: 0.1
    intra_layers: 12
    inter_layers: 9
    attn_heads: 8

intent:
  token_dim: 256
  latent_dim: 128
  kl_weight: 1.0e-3
  kl_warmup_steps: 10000
  token_prediction_weight: 0.1
  partner_prediction_weight: 1.0
  balance_sources: true
  real_pair_sampling_weight: 4.0
  freeze_human_backbone_stage2: true

train:
  epochs: 100
  batch_size: 256
  num_workers: 4
  lr: 3.0e-4
  weight_decay: 1.0e-4
  lambda_pre: 1.0
  lambda_rec: 0.5
  save_every: 20

sequence:
  obs_len: 60
  pred_len: 10
  coord_dim: 3
  target_joints: 21
  input_domain: dct
  output_domain: dct
  supervision_domain: time
  reconstruction_domain: dct
  relative_output: true

datasets:
  root: /data/user/qkh/datasets
  normalization:
    target_layout: optitrack21
    unit: m
    root_center: true
    validate_scale: true
    min_extent_m: 0.25
    max_extent_m: 3.5
  sources:
    - name: CMU-Human-Interaction
      path: D:/datasets/cmu_mocap/cmu_mocap/human_interaction/data_aug
      split: train
      is_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: optitrack21
      unit_scale: 1.0
      intent_supervision: true

    - name: 3DPW
      path: D:/datasets/3DPW/3DPW/data_aug
      split: train
      is_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: optitrack21
      unit_scale: 1.0
      intent_supervision: true

    - name: amass
      path: D:/datasets/amass/amass/data_aug
      split: train
      is_multi_person: false
      converted_to_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: optitrack21
      unit_scale: 1.0
      intent_supervision: true

    - name: h3.6m
      path: D:/datasets/h3.6m/h3.6m/data_aug
      split: train
      is_multi_person: false
      converted_to_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: optitrack21
      unit_scale: 1.0
      intent_supervision: true

    - name: MuPots-3d
      path: D:/datasets/MuPots-3d/MuPots-3d
      split: test
      is_multi_person: true
      format: npz
      enabled: false
      intent_supervision: false
      reason: multi-person 3-D pose test benchmark; excluded to prevent test leakage

preprocess:
  script: D:/code/hrc/code/Human_to_Robot/dataset/data_prepocess.py
  out_folder_name: data_aug
  max_files_per_dataset: 0
  target_fps: 30
  smplh_model_dir: D:/datasets/amass/body_models
  smplh_joint_backend: numpy
  augment_single_person:
    enable: true
    datasets: [amass, h3.6m]
    method: random_cross_sequence_shared_scene
    min_pair_distance_m: 0.8
    max_pair_distance_m: 2.0
    intent_supervision: true
