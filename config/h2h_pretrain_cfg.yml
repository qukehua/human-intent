stage: 1
name: human_to_human_pretrain
seed: 42

model:
  file: network/model.py
  class_name: AINet
  freeze_cross_attn: false
  use_ifb: false
  motion_mlp:
    hidden_dim: 512
    embed_dim: 512
    dropout: 0.1
    intra_layers: 12
    inter_layers: 9
    attn_heads: 8

intent:
  token_dim: 256
  latent_dim: 128
  kl_weight: 1.0e-3
  kl_warmup_steps: 10000
  token_prediction_weight: 0.1
  partner_prediction_weight: 1.0
  real_pair_sampling_weight: 4.0
  freeze_human_backbone_stage2: true

train:
  epochs: 100
  batch_size: 256
  num_workers: 4
  lr: 3.0e-4
  weight_decay: 1.0e-4
  lambda_pre: 1.0
  lambda_rec: 0.5
  save_every: 20

sequence:
  obs_len: 60
  pred_len: 10
  coord_dim: 3
  target_joints: 21
  input_domain: dct
  output_domain: dct
  supervision_domain: time
  reconstruction_domain: dct
  relative_output: true

datasets:
  root: /data/user/qkh/datasets
  normalization:
    target_layout: optitrack21
    unit: m
    root_center: true
    validate_scale: true
    min_extent_m: 0.25
    max_extent_m: 3.5
  sources:
    - name: CMU-Human-Interaction
      path: D:/datasets/cmu_mocap/cmu_mocap/human_interaction/data_aug
      split: train
      is_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: optitrack21
      unit_scale: 1.0

    - name: 3DPW
      path: /data/user/qkh/datasets/3DPW/data_aug
      split: train
      is_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: smpl24
      unit_scale: 1.0

    - name: amass
      path: /data/user/qkh/datasets/amass/data_aug
      split: train
      is_multi_person: false
      converted_to_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: smpl24
      unit_scale: 1.0

    - name: h3.6m
      path: /data/user/qkh/datasets/h3.6m/data_aug
      split: train
      is_multi_person: false
      converted_to_multi_person: true
      format: npz
      keys: [person_a, person_b]
      joint_layout: h36m32
      unit_scale: 0.001

    - name: MuPots-3d
      path: /data/user/qkh/datasets/MuPots-3d/data_aug
      split: train
      is_multi_person: true
      format: npz
      enabled: false

preprocess:
  script: /data/user/qkh/human_to_robot/dataset/data_prepocess.py
  out_folder_name: data_aug
  max_files_per_dataset: 200
  augment_single_person:
    enable: true
    methods: [copy, rotate_z, mirror_x]
    rotate_deg: [25, 40]
    x_offset: 0.6
